<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#042C53">
    <title>Estamos preparando algo especial — Cabañas El Progreso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            padding: 24px;
            background: linear-gradient(160deg, #042C53 0%, #0C447C 100%);
            color: #ffffff;
            text-align: center;
        }
        .card {
            max-width: 560px;
        }
        .card__tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(133, 183, 235, 0.18);
            color: #B5D4F4;
            border: 1px solid rgba(133, 183, 235, 0.35);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.2;
            margin-bottom: 16px;
        }
        h1 strong { font-weight: 700; }
        p {
            color: #B5D4F4;
            font-size: 1rem;
            line-height: 1.7;
            max-width: 440px;
            margin: 0 auto;
        }
        .card__footer {
            margin-top: 40px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="card__tag">🌿 Cabañas El Progreso</span>
        <h1>Estamos preparando <strong>algo especial</strong></h1>
        <p>Estamos renovando nuestro sitio para ofrecerte una mejor experiencia. Vuelve pronto — ¡ya casi estamos listos!</p>
        <div class="card__footer">Glamping El Progreso · glamping-el-progreso.com</div>
    </div>
</body>
</html>
