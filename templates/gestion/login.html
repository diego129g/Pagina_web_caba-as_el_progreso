<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Cabañas El Progreso</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/gestion.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-card__brand">
            <h1>Cabañas El Progreso</h1>
            <p>Panel de administración</p>
        </div>

        {% if form.errors %}
            <div class="error-msg">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" id="id_username" name="username" autofocus placeholder="Tu usuario">
            </div>
            <div class="form-group">
                <label for="id_password">Contraseña</label>
                <input type="password" id="id_password" name="password" placeholder="Tu contraseña">
            </div>
            <button type="submit" class="btn-primary">🔐 Ingresar</button>
        </form>
    </div>
</div>
</body>
</html>
