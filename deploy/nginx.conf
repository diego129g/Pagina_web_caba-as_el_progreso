# Config de nginx — Cabañas El Progreso
# Copiar a /etc/nginx/sites-available/cabanas y enlazar en sites-enabled.
#
# whitenoise ya sirve los estáticos dentro de gunicorn (CompressedManifest
# StaticFilesStorage), así que nginx solo necesita hacer de reverse proxy —
# no hace falta una location aparte para /static/.

upstream gunicorn_cabanas {
    server unix:/run/gunicorn/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;

    # Sin dominio todavía: se sirve directo por la IP estática.
    # Cuando tengas dominio, agregalo acá (server_name midominio.com www.midominio.com;)
    # y corré certbot --nginx para que él mismo agregue el bloque HTTPS.
    server_name 16.144.59.186;

    client_max_body_size 10M;

    location / {
        proxy_pass http://gunicorn_cabanas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
